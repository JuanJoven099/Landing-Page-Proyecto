<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AdminMarket</title>

    <!-- Archivo CSS -->
    <link rel="stylesheet" href="inicio.css">
</head>

<body>

    <main class="contenedor">

        <div class="cuadro">

            <a href="../menu.html" class="btn-back">←</a>

            <h1>Iniciar <span>Sesión</span></h1>
            <p class="descripcion">Ingresa tus datos para continuar</p>

            <form action="#" method="post">

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="btn btn-iniciar">
                    Iniciar sesión
                </button>

            </form>

            <p class="texto-inferior">
                ¿No tienes una cuenta?
                <a href="../registrar/registro.html">Crear cuenta</a>
            </p>

        </div>

    </main>
 <script src="index.js"></script>
</body>

</html>
